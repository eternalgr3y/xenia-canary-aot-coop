name: Same-PC runtime-core contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify public source boundary
        shell: pwsh
        run: ./tools/public-alpha/test_same_pc_public_core.ps1

      - name: Install Vulkan shader tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdkVersion = '1.4.357.0'
          $sdkRoot = "C:\VulkanSDK\$sdkVersion"
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk-$sdkVersion.exe"
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/vulkansdk-windows-X64-$sdkVersion.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installer
          $expectedHash = '81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Vulkan SDK installer SHA-256 mismatch.'
          }
          $install = Start-Process -FilePath $installer -ArgumentList @(
            '--root', $sdkRoot, '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          ) -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) {
            throw "Vulkan SDK installation failed with exit code $($install.ExitCode)."
          }
          $sdkBin = Join-Path $sdkRoot 'Bin'
          $env:VULKAN_SDK = $sdkRoot
          $env:PATH = "$sdkBin;$env:PATH"
          foreach ($tool in @('glslangValidator', 'spirv-opt', 'spirv-dis')) {
            $executable = Join-Path $sdkBin "$tool.exe"
            if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
              throw "Missing Vulkan shader tool: $executable"
            }
            & $executable --version
            if ($LASTEXITCODE -ne 0) {
              throw "$tool verification failed with exit code $LASTEXITCODE."
            }
          }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sdkBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build focused runtime-core tests
        shell: pwsh
        run: python xenia-build.py build --config=release --target=xenia-kernel-tests --build-tests

      - name: Run focused runtime-core tests
        shell: pwsh
        run: ./build/bin/Windows/Release/xenia-kernel-tests.exe '[aot-runtime-core]'

      - name: Build Xenia app integration
        shell: pwsh
        run: python xenia-build.py build --config=release --target=xenia-app --build-tests --no_premake
